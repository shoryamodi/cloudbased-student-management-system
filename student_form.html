{% extends "base.html" %}
{% block content %}
<h1>{{ 'Edit student' if s else 'Add student' }}</h1>
<div class="card">
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <div class="grid">
      <div><label>Roll number *</label><input name="roll_no" value="{{ s.roll_no if s else request.form.roll_no }}" required></div>
      <div><label>Full name *</label><input name="name" value="{{ s.name if s else request.form.name }}" required></div>
      <div><label>Email</label><input name="email" type="email" value="{{ s.email if s else request.form.email }}"></div>
      <div><label>Phone</label><input name="phone" value="{{ s.phone if s else request.form.phone }}"></div>
      <div><label>Department</label><input name="dept" value="{{ s.dept if s else request.form.dept }}"></div>
      <div><label>Year</label>
        <select name="year">{% for y in range(1,7) %}
          <option value="{{ y }}" {{ 'selected' if s and s.year==y }}>{{ y }}</option>{% endfor %}
        </select></div>
    </div>
    <div class="row" style="margin-top:18px">
      <button class="btn">Save</button>
      <a class="btn ghost" href="{{ url_for('students') }}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
