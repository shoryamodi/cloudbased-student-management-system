<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Student Management{% endblock %}</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#1c2333;--muted:#667085;--brand:#2f5bea;--line:#e4e7ee;--ok:#12805c;--err:#c0392b}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
nav{background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:20px;padding:12px 24px}
nav .brand{font-weight:700;color:var(--brand);margin-right:12px}
nav a{color:var(--ink);text-decoration:none}
nav a:hover{color:var(--brand)}
nav form{margin-left:auto}
main{max-width:1000px;margin:24px auto;padding:0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:20px}
h1{font-size:22px;margin:0 0 16px}h2{font-size:17px;margin:0 0 12px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
input,select{padding:8px 10px;border:1px solid var(--line);border-radius:6px;font:inherit;background:#fff}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.grid input,.grid select{width:100%}
.btn{display:inline-block;padding:8px 14px;border:0;border-radius:6px;background:var(--brand);color:#fff;font:inherit;cursor:pointer;text-decoration:none}
.btn.ghost{background:#eef1fb;color:var(--brand)}
.btn.danger{background:#fdecea;color:var(--err)}
.btn.sm{padding:4px 10px;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px}
.stat b{display:block;font-size:30px}.stat span{color:var(--muted)}
.flash{padding:10px 14px;border-radius:6px;margin-bottom:14px}
.flash.ok{background:#e6f6ef;color:var(--ok)}.flash.error{background:#fdecea;color:var(--err)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.inline{display:inline}
.muted{color:var(--muted)}
</style>
</head>
<body>
{% if session.user %}
<nav>
  <span class="brand">🎓 Student Management</span>
  <a href="{{ url_for('dashboard') }}">Dashboard</a>
  <a href="{{ url_for('students') }}">Students</a>
  <a href="{{ url_for('courses') }}">Courses</a>
  <form method="post" action="{{ url_for('logout') }}">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <button class="btn ghost sm">Log out</button>
  </form>
</nav>
{% endif %}
<main>
  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in msgs %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
