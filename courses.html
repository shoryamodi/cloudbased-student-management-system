{% extends "base.html" %}
{% block content %}
<h1>Courses</h1>
<div class="card">
  <h2>Add course</h2>
  <form class="row" method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <input name="code" placeholder="Code (e.g. CS101)" required>
    <input name="title" placeholder="Title" style="flex:1;min-width:200px" required>
    <input name="credits" type="number" min="1" max="10" value="3" style="width:80px">
    <button class="btn">Add</button>
  </form>
</div>
<div class="card">
  {% if courses %}
  <table>
    <tr><th>Code</th><th>Title</th><th>Credits</th><th>Enrolled</th><th></th></tr>
    {% for c in courses %}
    <tr>
      <td>{{ c.code }}</td><td>{{ c.title }}</td><td>{{ c.credits }}</td><td>{{ c.n }}</td>
      <td style="text-align:right">
        <form class="inline" method="post" action="{{ url_for('course_delete', cid=c.id) }}"
              onsubmit="return confirm('Delete {{ c.code|e }}?')">
          <input type="hidden" name="csrf" value="{{ csrf_token() }}">
          <button class="btn danger sm">Delete</button>
        </form>
      </td>
    </tr>
    {% endfor %}
  </table>
  {% else %}<p class="muted">No courses yet.</p>{% endif %}
</div>
{% endblock %}
