{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="card" style="max-width:380px;margin:80px auto">
  <h1>🎓 Student Management</h1>
  <p class="muted">Sign in as administrator</p>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label>Username</label>
    <input name="username" style="width:100%;margin-bottom:12px" autofocus required>
    <label>Password</label>
    <input name="password" type="password" style="width:100%;margin-bottom:16px" required>
    <button class="btn" style="width:100%">Sign in</button>
  </form>
</div>
{% endblock %}
